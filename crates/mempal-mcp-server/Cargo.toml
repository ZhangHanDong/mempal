[package]
name = "mempal-mcp-server"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "MCP server adapter for mempal runtime tools."
repository = "https://github.com/ZhangHanDong/mempal"
homepage = "https://github.com/ZhangHanDong/mempal"
documentation = "https://docs.rs/mempal-mcp-server"
rust-version = "1.85"
keywords = ["memory", "mcp", "agents", "server"]
categories = ["development-tools"]

[features]
default = ["model2vec"]
model2vec = ["mempal-runtime/model2vec"]
onnx = ["mempal-runtime/onnx"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
mempal-runtime = { version = "0.8.0", path = "../mempal-runtime", default-features = false }
rmcp = { version = "1.3.0", features = ["server", "macros", "schemars", "transport-async-rw", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
