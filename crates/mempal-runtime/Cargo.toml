[package]
name = "mempal-runtime"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "Reusable mempal runtime workflows built on agent memory storage."
repository = "https://github.com/ZhangHanDong/mempal"
homepage = "https://github.com/ZhangHanDong/mempal"
documentation = "https://docs.rs/mempal-runtime"
rust-version = "1.85"
keywords = ["memory", "agents", "search", "mcp"]
categories = ["development-tools"]

[features]
default = ["model2vec"]
model2vec = ["mempal-embed/model2vec"]
onnx = ["mempal-embed/onnx"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bimap = "0.6"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
jieba-rs = "0.8"
mempal-agent-memory = { version = "0.8.0", path = "../mempal-agent-memory" }
mempal-embed = { version = "0.8.0", path = "../mempal-embed", default-features = false }
mempal-mcp-protocol = { version = "0.8.0", path = "../mempal-mcp-protocol" }
mempal-search-core = { version = "0.8.0", path = "../mempal-search-core" }
mempal-store-sqlite = { version = "0.8.0", path = "../mempal-store-sqlite" }
rmcp = { version = "1.3.0", features = ["schemars"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt", "macros"] }
toml = "0.8"
