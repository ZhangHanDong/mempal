[package]
name = "mempal"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "Project memory for coding agents. Single binary, hybrid search, knowledge graph."
repository = "https://github.com/ZhangHanDong/mempal"
homepage = "https://github.com/ZhangHanDong/mempal"
documentation = "https://github.com/ZhangHanDong/mempal"
rust-version = "1.85"
readme = "README.md"
keywords = ["memory", "mcp", "sqlite", "agents", "search"]
categories = ["command-line-utilities", "development-tools"]
# Keep the published crate tarball focused on runtime + downstream-facing
# docs. Everything below is maintainer-only repo material that should never
# ship to crates.io. See release tag notes for rationale.
exclude = [
    ".claude/**",     # local Claude Code config + hooks (hard blocker if shipped)
    ".mcp.json",      # local MCP server registration for this repo
    "AGENTS.md",      # repo-only agent working rules
    "CLAUDE.md",      # repo-only agent working rules (same content as AGENTS.md)
    "hooks/**",       # legacy project-level hooks; not part of mempal runtime
    "specs/**",       # internal agent-spec Task Contracts (README links redirected to GitHub)
    "docs/plans/**",  # internal implementation plans (README links redirected to GitHub)
    "books/**",       # mdBook manuscript + 2.5MB local Mermaid asset; repo/docs only, not runtime
]

[workspace]
members = [
    ".",
    "crates/mempal-agent-memory",
    "crates/mempal-embed",
    "crates/mempal-mcp-server",
    "crates/mempal-mcp-protocol",
    "crates/mempal-runtime",
    "crates/mempal-search-core",
    "crates/mempal-store-sqlite",
]
resolver = "2"

[[bin]]
name = "mempal"
path = "src/main.rs"

[features]
default = ["model2vec"]
model2vec = ["mempal-embed/model2vec", "mempal-runtime/model2vec", "mempal-mcp-server/model2vec"]
onnx = ["mempal-embed/onnx", "mempal-runtime/onnx", "mempal-mcp-server/onnx"]
rest = ["dep:axum", "dep:tower", "dep:tower-http", "model2vec"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", optional = true }
bimap = "0.6"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
jieba-rs = "0.8"
mempal-agent-memory = { version = "0.8.0", path = "crates/mempal-agent-memory" }
mempal-embed = { version = "0.8.0", path = "crates/mempal-embed", default-features = false }
mempal-mcp-server = { version = "0.8.0", path = "crates/mempal-mcp-server", default-features = false }
mempal-mcp-protocol = { version = "0.8.0", path = "crates/mempal-mcp-protocol" }
mempal-runtime = { version = "0.8.0", path = "crates/mempal-runtime", default-features = false }
mempal-search-core = { version = "0.8.0", path = "crates/mempal-search-core" }
mempal-store-sqlite = { version = "0.8.0", path = "crates/mempal-store-sqlite" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "1.3.0", features = ["server", "macros", "schemars", "transport-async-rw", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlite-vec = "0.1.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[profile.release]
opt-level = "z"        # optimize for size (slightly slower than "3" but much smaller)
lto = true             # link-time optimization — biggest size reduction
codegen-units = 1      # single codegen unit — better optimization, slower compile
strip = true           # strip debug symbols from binary
panic = "abort"        # no unwinding — smaller binary, faster panic

[dev-dependencies]
axum = "0.8"
serde_json = "1"
tempfile = "3"
